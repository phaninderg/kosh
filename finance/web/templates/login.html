<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457d6"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<title>Sign in · Kosh</title><link rel="stylesheet" href="/static/style.css"></head><body class="login">
<main class="login-box">
 <h1><img src="/static/icons/icon-192.png" alt="" width="40" height="40"> Kosh</h1>
 {% if error %}<div class="flash err" role="alert">{{ error }}</div>{% endif %}
 <form method="post" action="/login" class="card" autocomplete="on">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  {% if needs_code %}<label for="code">Code from your authenticator app</label>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="8" required>{% endif %}
  <p><button style="width:100%">Sign in</button></p>
 </form>
</main></body></html>
