{% extends "auth_base.html" %}{% block body %}
<form method="post" action="/login" class="card" autocomplete="on">
 <input type="hidden" name="next" value="{{ next }}">
 <label for="nm">Name</label>
 <input id="nm" name="name" value="{{ name or '' }}" autocomplete="username" required autofocus>
 <label for="pw">Password</label>
 <input id="pw" name="password" type="password" autocomplete="current-password" required>
 <p><button style="width:100%">Sign in</button></p>
 <p class="mute small" style="text-align:center">Your password also unlocks your encrypted data.</p>
</form>
<div class="card">
 <button class="sec" style="width:100%" data-passkey="login" data-next="{{ next }}" hidden>Sign in with a passkey</button>
 <p class="mute small" id="pk-msg" role="status"></p>
 <p class="small"><a href="/recover">Forgot your password?</a> · <a href="/signup">Have an invite code?</a></p>
 <details><summary class="small">Add a passkey on this device with a code</summary>
  <label for="lc">Code from your Account page</label><input id="lc" autocomplete="off" placeholder="XXXX-XXXX-XXXX">
  <p><button class="sec" type="button" data-passkey="link" data-code-from="lc">Add passkey</button></p></details>
</div>{% endblock %}
