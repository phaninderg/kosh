# docker compose up -d, then `docker compose logs kosh` prints the setup code; open the printed address and create your profile.
services:
  kosh:
    image: ghcr.io/phaninderg/kosh:latest
    build: .
    ports:
      - "127.0.0.1:${KOSH_PORT:-8765}:8765"        # loopback only; for a server on the internet use docker-compose.vps.yml
    environment:
      KOSH_PUBLIC_PORT: ${KOSH_PORT:-8765}           # so the printed link and the host check use the port you chose
    volumes:
      - kosh-data:/app/data
    restart: unless-stopped
    read_only: true                       # the container's own files cannot be changed; only the data volume and /tmp are writable
    tmpfs:
      - /tmp:size=512m,mode=1777          # statements are parsed from here, in memory, never on the disk layer
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m                      # a hostile PDF cannot take the whole machine
    pids_limit: 256

volumes:
  kosh-data:
